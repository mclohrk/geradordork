<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Dork</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Gerador de Dork</h1>
  <p class="sub">Gerador de buscas Google Dorking organizadas em categorias copie e cole ou abra em nova aba clicando no botão</p>

  <div class="search-card">
    <div class="search-box">
      <input id="alvo" type="text" placeholder="example.com" oninput="render()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </div>
    <p class="hint">ⓘ Digite o domínio sem http:// ou https:// (opcional sem isso, as dorks abrem sem restrição de site)</p>
  </div>

  <div id="tagCloud" class="tag-cloud"></div>

  <div id="topStatus"></div>
  <div id="categorias"></div>

<script src="script.js"></script>
</body>
</html>
